# OrcaCode Review — model-selection policy (the real recipe).
#
# Paste this into the per-workspace router `orcarouter/orcacode-review`
# (Dashboard → Routers → orcacode-review → DSL). The Action never names a model; it
# only injects raw facts as headers and this recipe decides which model runs.
#
# THE ROUTER WAS RENAMED. It used to be `code-review`; setup renames an existing one
# and provisions new workspaces under the new name. The error names the alias that was
# REQUESTED, not the one the workspace holds, so the two failures mean opposite things:
#
#   model router 'orcacode-review' not found
#     The caller asked for the new name and this workspace is still on the old one.
#     Run setup, which renames it.
#
#   model router 'code-review' not found
#     Something is still explicitly asking for the OLD name after the rename — a
#     `router:` input in the workflow, or a recipe pasted into a router of that name.
#     Setup will not help; drop the override.
#
# MIGRATION — this recipe lives in YOUR OrcaRouter workspace, not in the Action, so
# bumping the Action version does NOT update it. An install still running an older
# recipe (e.g. `promoted` -> z-ai/glm-5.1) keeps routing that model until you
# re-paste the block below.
#
# Facts injected by the Action on every request (via the in-job proxy shim):
#   x-cr-prev-tier : standard        (the tier recorded for this run)
#   x-cr-prev-p0p1 : true | false    (did the previous pass find a P0/P1)
#
# x-cr-prev-tier has ONE value now. It used to be none | cheap | strong, back
# when a cheap pass could escalate to a strong one; a rule you wrote against
# `cheap` or `strong` will never match again and will fall through to the
# default. It is still sent because it still says what the run was recorded as.
#
# ONE DEFAULT, because one model reviews every run. Add rules above it when you
# want more than that — the facts to branch on are already arriving.
#
# Nothing reads them today. They are sent anyway so that a policy which wants
# them — routing small diffs to a cheaper model, say, decided up front and still
# one pass — is an edit to this file in your own workspace rather than a wait for
# an Action release.
#
# TWO CALLS, TWO LINES TO EDIT. The Action asks this router for two things, both
# with the alias as the `model` rather than a model name:
#
#   the review  — carries no angle, so it takes `default:`
#   the L2 judge — stamps `x-cr-lens: judge`, so the rule below claims it
#
# Swap in anything your OrcaRouter workspace can reach (openai/gpt-5.5,
# anthropic/claude-opus-4-8, z-ai/glm-5.1, z-ai/glm-5.3). The default
# is the single highest-leverage change you can make to review quality — nothing
# else in this recipe affects what the reviewer can see or say.
#
# THE JUDGE MUST NOT NAME THE DEFAULT'S MODEL. The judge scores what the review
# found and drops what it cannot support; on the reviewer's own model it agrees
# with itself, so the pass goes inert while still reporting success. Deleting the
# rule does not disable the judge — the Action runs it either way — it only sends
# it to `default:`, which is the one place it must not go. If you change the
# default, change the judge too.
#
# These values are what setup provisions, so this file and a freshly created
# router agree.

version: 1
rules:
  - id: judge
    when: 'headers["x-cr-lens"] == "judge"'
    use: { model: "z-ai/glm-5.3" }
default:
  model: "deepseek/deepseek-v4-flash-0731"
