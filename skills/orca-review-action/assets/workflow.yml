# OrcaCode Review — https://github.com/Continuum-AI-Corp/orca-code-review
#
# The review logic lives in the published action, so this file never copies
# scripts or config. The action is pinned to a release commit (version in the
# comment); let Dependabot's github-actions updates bump it. Add one repository
# secret, ORCAROUTER_API_KEY, and enable the app at
# OrcaRouter -> Apps -> OrcaCode Review.

name: OrcaCode Review

on:
  # `synchronize` re-reviews on every new push and `reopened` reviews a PR that
  # comes back. `edited` re-reviews a PR RETARGETED to another base branch (the
  # job's `if:` ignores title and description edits). `ready_for_review` makes
  # the dashboard's trigger=ready_for_review mode fire when a draft is ready.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write # clean/fallback PR comments
  statuses: write # the verdict on the PR head — the check to make required

jobs:
  review:
    runs-on: ubuntu-latest
    # Concurrency is PER JOB, in two groups. A workflow-level group with
    # cancel-in-progress let ANY comment on the PR cancel an in-flight review:
    # every comment starts a run in the same group, which then skips. Push runs
    # share one group per PR and a newer push supersedes an older one; comment
    # runs (/orcacode-review) get their own group and never cancel anything.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name == 'issue_comment' && 'comment' || 'pr' }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: ${{ github.event_name != 'issue_comment' }}
    # Run on PR events, or when a trusted user comments the review command on a
    # PR. All four spellings are accepted — either prefix (`/` or `@`) with
    # either separator (hyphen or space). The command runs this privileged
    # `pull_request_target` workflow with the OrcaRouter secret, so only
    # maintainers may trigger it — otherwise any participant could burn paid
    # quota and spam reviews without pushing new commits.
    if: |
      (github.event_name == 'pull_request_target' &&
        (github.event.action != 'edited' || github.event.changes.base)) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (startsWith(github.event.comment.body, '/orcacode-review') ||
          startsWith(github.event.comment.body, '/orcacode review') ||
          startsWith(github.event.comment.body, '@orcacode-review') ||
          startsWith(github.event.comment.body, '@orcacode review')) &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    steps:
      - uses: Continuum-AI-Corp/orca-code-review@6d253e0399c84848fedc8801176d6bea77817762 # v1.6.0
        with:
          orcarouter-api-key: ${{ secrets.ORCAROUTER_API_KEY }}
          # Everything below is optional. Keep only the lines you actually
          # override — anything omitted follows the documented default (and,
          # unless `settings: "false"`, the OrcaRouter dashboard).
          #
          # settings: "true"            # "false" = this file is authoritative
          # block-on: "P0,P1"           # severities that fail the check
          # fix-first: "P0,P1"          # exhaustive only: stop adding passes once found
          # on-oversized-diff: "fail"   # "pass" makes an oversized skip advisory
          # auto-review-authors: ""     # public repos: e.g. "OWNER,MEMBER,COLLABORATOR,CONTRIBUTOR"
          # max-diff-kb: "5000"
          # max-diff-files: "2000"
          # timeout-minutes: "60"
          # report: "true"              # severity counts only — never code
