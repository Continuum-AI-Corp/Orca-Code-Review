# OrcaCode Review — example consumer workflow.
#
# Copy this file into your repo at `.github/workflows/` and add one secret,
# `ORCAROUTER_API_KEY`. The review logic lives in the published action, so you
# never copy scripts or config — just bump the version tag to update.
#
# One review per push: findings post as inline PR comments, and a severity gate
# can fail the
# check to block the merge — mark it "required" in branch protection.

name: OrcaCode Review

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

on:
  # `synchronize` re-reviews on every new push — the per-commit review loop. The
  # re-run needed — and a GITHUB_TOKEN label change can't trigger one anyway).
  # `ready_for_review` makes the dashboard's trigger=ready_for_review mode fire
  # when a draft PR becomes ready (drafts are skipped in that mode).
  pull_request_target:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write # clean/fallback PR comments

jobs:
  review:
    runs-on: ubuntu-latest
    # Run on PR events, or when a trusted user comments the review command on a
    # PR. All four spellings are accepted — either prefix (`/` or `@`) with
    # either separator (hyphen or space) — which is the same set the OrcaCode
    # Review GitHub App takes. Accept the full cross or you build a trap: a
    # reader who writes the one spelling you left out gets no run and no error
    # to explain why. The command runs the privileged `pull_request_target`
    # workflow with the OrcaRouter secret, so only maintainers
    # (owner/member/collaborator) may trigger it — otherwise any participant
    # could burn paid quota and spam reviews without pushing new commits.
    if: |
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (startsWith(github.event.comment.body, '/orcacode-review') ||
          startsWith(github.event.comment.body, '/orcacode review') ||
          startsWith(github.event.comment.body, '@orcacode-review') ||
          startsWith(github.event.comment.body, '@orcacode review')) &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    steps:
      - uses: Continuum-AI-Corp/orca-code-review@v1
        with:
          orcarouter-api-key: ${{ secrets.ORCAROUTER_API_KEY }}
          # All optional — uncomment to override the defaults:
          # orcarouter-url: ${{ secrets.ORCAROUTER_URL }}
          # brand: "OrcaCode Review"
          # router: "orcarouter/code-review"  # router whose DSL picks the model
          # fix-first: "P0,P1"   # exhaustive only: stop adding passes once one is found
          # block-on: "P0"       # fail the check (block merge) on these
          # max-diff-kb: "512"   # bigger diffs skip the review (outcome: on-oversized-diff)
          # max-diff-files: "300"  # same skip when the diff touches more files than this
          # on-oversized-diff: "fail"  # oversized skip fails the check; "pass" makes it advisory
          # settings: "true"     # "false" skips the dashboard fetch — this file is authoritative
          # report: "true"       # per-run severity counts (never code) to your control plane
          # timeout-minutes: "20"  # wall-clock ceiling per engine pass; bump for very large PRs
